apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.app.crb.metrics_reader_name }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.app.sa.monitoring_name }}
  namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.app.roles.metrics_reader_name }}
  apiGroup: rbac.authorization.k8s.io