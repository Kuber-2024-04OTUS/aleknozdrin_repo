apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.app.cm.random_values_name }}
  namespace: {{ .Values.namespace }}
data:
  foo: bar
  course: otus-kubernetes 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.app.cm.nginx_config_name }}
  namespace: {{ .Values.namespace }}
data:
  nginx.conf: |
    user nginx;
    worker_processes  1;
    events {
      worker_connections  10240;
    }
    http {
      server {
          listen 8000;
          location / {
              root /homework;
              autoindex on;
          }
      }
    }