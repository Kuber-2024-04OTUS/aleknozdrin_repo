apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.services.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector: 
    app: {{ .Values.app.name }}
  ports:
    - protocol: TCP
      port: {{ .Values.network.external_port }}
      targetPort: {{ .Values.network.application_port }}